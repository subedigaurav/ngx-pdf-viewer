<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngx-pdf-viewer</title>
    <script>
      // GitHub Pages SPA fallback: strip the repo base and route client-side.
      const base = '/ngx-pdf-viewer/';
      const path = window.location.pathname.replace(new RegExp('^' + base), '');
      window.location.replace(base + 'index.html?__gh_redirect=' + encodeURIComponent(path) + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
