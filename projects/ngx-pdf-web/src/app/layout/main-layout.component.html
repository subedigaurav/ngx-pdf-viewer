<div class="layout min-h-screen flex flex-col bg-paper text-ink">
  <a
    href="#main-content"
    class="skip-link absolute -left-9999 top-0 px-3 py-2 bg-signal text-signal-on rounded-br-sm font-semibold text-sm z-40 no-underline focus:left-0">
    Skip to content
  </a>

  <header
    class="topbar shrink-0 h-14 flex items-center gap-2 sm:gap-4 px-4 sm:px-6 bg-paper/92 backdrop-blur-md border-b border-stone sticky top-0 z-30">
    @if (isDocsRoute()) {
      <button
        type="button"
        class="nav-toggle md:hidden inline-flex items-center justify-center h-9 w-9 -ml-1 shrink-0 rounded-md border border-stone bg-transparent text-muted transition-colors hover:text-ink hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:outline-offset-2"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen()"
        aria-controls="docs-sidebar"
        [attr.aria-label]="sidebarOpen() ? 'Close documentation menu' : 'Open documentation menu'">
        <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-md">{{
          sidebarOpen() ? 'close' : 'menu'
        }}</mat-icon>
      </button>
    }

    <nav class="top-nav" aria-label="Primary">
      <a
        routerLink="/demo"
        routerLinkActive="nav-tab-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-tab"
        >Demo</a
      >
      <a routerLink="/docs" routerLinkActive="nav-tab-active" ariaCurrentWhenActive="page" class="nav-tab">Docs</a>
    </nav>

    <div class="topbar-actions ml-auto flex items-center gap-2">
      <a
        class="version-badge hidden sm:inline-flex items-center gap-1.5 h-8 px-2.5 rounded-sm border border-stone font-mono text-xs font-medium text-muted no-underline transition-colors hover:text-ink hover:border-outline hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:outline-offset-2"
        href="https://www.npmjs.com/package/@gavsby/ngx-pdf-viewer"
        target="_blank"
        rel="noopener"
        aria-label="Version 1.0.0 on npm">
        <span aria-hidden="true">v1.0.0</span>
        <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-2xs opacity-70"
          >open_in_new</mat-icon
        >
      </a>
      <a
        class="gh-link inline-flex items-center gap-1.5 h-8 px-2.5 sm:px-3 rounded-sm text-sm font-medium text-muted no-underline border border-stone bg-transparent transition-colors hover:text-ink hover:bg-surface-container hover:border-outline focus-visible:outline focus-visible:outline-signal focus-visible:outline-offset-2"
        href="https://github.com/subedigaurav/ngx-pdf-viewer"
        target="_blank"
        rel="noopener"
        aria-label="GitHub repository">
        <svg
          aria-hidden="true"
          viewBox="0 0 16 16"
          width="18"
          height="18"
          fill="currentColor"
          class="shrink-0 opacity-90">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
        <span class="hidden sm:inline">GitHub</span>
        <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-2xs opacity-70"
          >open_in_new</mat-icon
        >
      </a>
    </div>
  </header>

  <div class="content flex-1 min-h-0 flex flex-col w-full" [class.md:flex-row]="isDocsRoute()">
    @if (isDocsRoute()) {
      <div
        class="sidebar-scrim md:hidden fixed inset-0 top-14 z-20 bg-ink/35 backdrop-blur-[1px] transition-opacity"
        [class.opacity-0]="!sidebarOpen()"
        [class.pointer-events-none]="!sidebarOpen()"
        (click)="closeSidebar()"
        aria-hidden="true"></div>

      <nav
        id="docs-sidebar"
        class="docs-sidebar fixed top-14 bottom-0 left-0 z-20 w-62 invisible -translate-x-full transition-[transform,visibility] duration-200 border-r border-stone bg-paper overflow-y-auto overscroll-contain md:visible md:translate-x-0 md:sticky md:top-14 md:bottom-auto md:z-auto md:h-[calc(100dvh-3.5rem)] md:shrink-0"
        [class.visible]="sidebarOpen()"
        [class.translate-x-0]="sidebarOpen()"
        (keydown.escape)="closeSidebar()"
        aria-label="Documentation">
        <div class="docs-sidebar-inner flex flex-col gap-6 p-5 min-h-full">
          <div class="sidebar-section flex flex-col gap-1">
            <span class="docs-sidebar-title px-2.5 py-1.5 text-xs font-semibold uppercase tracking-wider text-muted"
              >Introduction</span
            >
            <a
              routerLink="/docs/overview"
              routerLinkActive="docs-nav-active"
              ariaCurrentWhenActive="page"
              class="docs-nav-link flex items-center gap-2.5 px-2.5 py-2 text-sm font-medium leading-tight text-muted no-underline rounded-md transition-colors hover:text-ink hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:-outline-offset-1">
              <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-sm shrink-0 opacity-75"
                >info</mat-icon
              >
              <span>Overview</span>
            </a>
            <a
              routerLink="/docs/getting-started"
              routerLinkActive="docs-nav-active"
              ariaCurrentWhenActive="page"
              class="docs-nav-link flex items-center gap-2.5 px-2.5 py-2 text-sm font-medium leading-tight text-muted no-underline rounded-md transition-colors hover:text-ink hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:-outline-offset-1">
              <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-sm shrink-0 opacity-75"
                >rocket_launch</mat-icon
              >
              <span>Getting Started</span>
            </a>
            <a
              routerLink="/docs/features"
              routerLinkActive="docs-nav-active"
              ariaCurrentWhenActive="page"
              class="docs-nav-link flex items-center gap-2.5 px-2.5 py-2 text-sm font-medium leading-tight text-muted no-underline rounded-md transition-colors hover:text-ink hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:-outline-offset-1">
              <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-sm shrink-0 opacity-75"
                >check_circle</mat-icon
              >
              <span>Features</span>
            </a>
          </div>
          <div class="sidebar-section flex flex-col gap-1">
            <span class="docs-sidebar-title px-2.5 py-1.5 text-xs font-semibold uppercase tracking-wider text-muted"
              >Reference</span
            >
            <a
              routerLink="/docs/api"
              routerLinkActive="docs-nav-active"
              ariaCurrentWhenActive="page"
              class="docs-nav-link flex items-center gap-2.5 px-2.5 py-2 text-sm font-medium leading-tight text-muted no-underline rounded-md transition-colors hover:text-ink hover:bg-surface-container focus-visible:outline focus-visible:outline-signal focus-visible:-outline-offset-1">
              <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-sm shrink-0 opacity-75"
                >code</mat-icon
              >
              <span>API Reference</span>
            </a>
          </div>
          <a
            routerLink="/demo"
            class="docs-cta mt-auto flex items-center justify-between gap-3 px-3.5 py-3 rounded-lg bg-surface-container border border-stone text-ink no-underline transition-colors hover:bg-surface-container-high hover:border-outline focus-visible:outline focus-visible:outline-signal focus-visible:-outline-offset-2">
            <span class="docs-cta-copy flex flex-col leading-tight">
              <strong class="text-sm font-semibold tracking-tight">Try the live demo</strong>
              <span class="text-xs text-muted">Explore viewer controls</span>
            </span>
            <mat-icon fontSet="material-symbols-rounded" aria-hidden="true" class="icon-sm text-muted shrink-0"
              >arrow_forward</mat-icon
            >
          </a>
        </div>
      </nav>
    }
    <main
      id="main-content"
      class="content-inner relative flex-1 min-w-0 min-h-0 w-full"
      [class.max-w-[52rem]]="isDocsRoute()"
      [class.mx-auto]="isDocsRoute()"
      [class.px-5]="isDocsRoute()"
      [class.py-8]="isDocsRoute()"
      [class.sm:p-8]="isDocsRoute()"
      [class.p-0]="!isDocsRoute()">
      <router-outlet />
    </main>
  </div>
</div>
