name: publish package to npm

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  publish:
    name: Verify tag and publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on master
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on master."
            exit 1
          fi

      - name: Verify tag matches library package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./projects/ngx-pdf-viewer/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match projects/ngx-pdf-viewer/package.json version (${PKG_VERSION})."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gavsby'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

      - name: Publish to npm
        run: npm publish ./dist/ngx-pdf-viewer --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
